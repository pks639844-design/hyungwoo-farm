<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>형우농원 카드뉴스</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #f0eee8;
  font-family: 'Noto Sans KR', sans-serif;
  padding: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  width: 1080px;
  height: 1080px;
  position: relative;
  background: #1a2617;
  overflow: hidden;
  border-radius: 24px;
  box-shadow: 0 30px 100px rgba(0,0,0,.3);
}

.bg-image {
  position: absolute;
  inset: 0;
  background-image: url('명이나물.jpg');
  background-size: cover;
  background-position: center;
  filter: brightness(0.55) saturate(1.25);
}

.bg-overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg,
      rgba(26,38,23,.55) 0%,
      rgba(26,38,23,.35) 40%,
      rgba(26,38,23,.85) 100%);
}

.frame {
  position: absolute;
  inset: 40px;
  border: 1.5px solid rgba(255,255,255,.18);
  border-radius: 12px;
  pointer-events: none;
}

.content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 90px 80px;
  color: #fff;
}

.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 26px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 2px;
}

.brand-mark {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #a8e6a0;
  border-radius: 50%;
  margin-right: 12px;
  vertical-align: middle;
}

.region {
  font-size: 14px;
  color: rgba(255,255,255,.7);
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 500;
}

.label {
  display: inline-block;
  padding: 12px 28px;
  background: rgba(127,181,119,.22);
  border: 1px solid rgba(168,230,160,.45);
  border-radius: 100px;
  color: #b8e6b3;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 4px;
  margin-top: 90px;
  backdrop-filter: blur(8px);
}

.headline {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 96px;
  font-weight: 800;
  line-height: 1.18;
  margin-top: 36px;
  text-shadow: 0 4px 28px rgba(0,0,0,.55);
}

.headline em {
  font-style: normal;
  color: #a8e6a0;
  display: block;
  margin-top: 6px;
}

.sub {
  font-size: 22px;
  line-height: 1.85;
  color: rgba(255,255,255,.86);
  margin-top: 40px;
  font-weight: 300;
  max-width: 780px;
  text-shadow: 0 2px 10px rgba(0,0,0,.4);
}

.divider {
  width: 60px;
  height: 2px;
  background: #a8e6a0;
  margin: 56px 0 32px;
}

.products {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.product {
  padding: 14px 24px;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 10px;
  font-size: 19px;
  font-weight: 500;
  color: #fff;
  backdrop-filter: blur(6px);
}

.bottom {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-top: 40px;
}

.bottom-left {
  font-family: 'Nanum Myeongjo', serif;
}

.farm-name {
  font-size: 44px;
  font-weight: 800;
  color: #fff;
  line-height: 1.1;
}

.farm-tag {
  font-size: 16px;
  color: rgba(168,230,160,.9);
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 400;
  letter-spacing: 1.5px;
  margin-top: 10px;
}

.bottom-right {
  text-align: right;
  font-size: 14px;
  color: rgba(255,255,255,.55);
  line-height: 1.9;
  letter-spacing: 1px;
}

.bottom-right strong {
  color: rgba(255,255,255,.9);
  font-weight: 700;
}

.badge-corner {
  position: absolute;
  top: 90px;
  right: 80px;
  z-index: 3;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #5fb356;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-family: 'Nanum Myeongjo', serif;
  font-weight: 800;
  text-align: center;
  box-shadow: 0 12px 36px rgba(95,179,86,.5);
  transform: rotate(-8deg);
}

.badge-corner .b1 {
  font-size: 14px;
  letter-spacing: 2px;
  opacity: .9;
}
.badge-corner .b2 {
  font-size: 24px;
  margin-top: 2px;
  line-height: 1;
}
.badge-corner .b3 {
  font-size: 11px;
  margin-top: 4px;
  opacity: .85;
  letter-spacing: 1px;
}
</style>
</head>
<body>

<div class="card">
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="frame"></div>

  <div class="badge-corner">
    <div class="b1">제철</div>
    <div class="b2">봄나물</div>
    <div class="b3">3 ~ 6월</div>
  </div>

  <div class="content">
    <div class="top-row">
      <div class="brand"><span class="brand-mark"></span>형우농원</div>
      <div class="region">GANGWON · INJE</div>
    </div>

    <div class="label">청정 자연이 키운 제철</div>

    <h1 class="headline">
      우리가 먹는 것이
      <em>곧 나를 이룬다</em>
    </h1>

    <p class="sub">
      강원도 인제 청정지역, 36년 공직 후 토박이가<br>
      직접 키우는 무농약 봄 산나물과 토종꿀.<br>
      당일 수확, 당일 발송으로 식탁 위에 봄을 차립니다.
    </p>

    <div class="divider"></div>

    <div class="products">
      <div class="product">명이나물</div>
      <div class="product">두릅</div>
      <div class="product">엄나무순</div>
      <div class="product">눈개승마</div>
      <div class="product">오가피순</div>
      <div class="product">토종꿀</div>
    </div>

    <div class="bottom">
      <div class="bottom-left">
        <div class="farm-name">형우농원</div>
        <div class="farm-tag">강원도 인제 · 산지직송</div>
      </div>
      <div class="bottom-right">
        <strong>무농약 자연재배</strong><br>
        당일수확 · 당일발송<br>
        예약 주문 가능
      </div>
    </div>
  </div>
</div>

</body>
</html>
